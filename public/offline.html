<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ออฟไลน์ - Khafai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-wrap {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.5rem;
      background: #f0fdf4;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #dcfce7;
    }
    .icon-wrap img {
      width: 3rem;
      height: 3rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      color: #dc2626;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #dc2626;
      border-radius: 50%;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/icons/icon-192x192.png" alt="Khafai Logo" />
    </div>
    <div class="badge">
      <span class="badge-dot"></span>
      ไม่มีการเชื่อมต่ออินเทอร์เน็ต
    </div>
    <h1>ไม่สามารถเชื่อมต่อระบบได้ในขณะนี้</h1>
    <p>อุปกรณ์ของคุณออฟไลน์อยู่ ข้อมูลที่เคยเปิดไว้จะถูกเก็บในเครื่อง และจะซิงค์ข้อมูลล่าสุดเมื่อเชื่อมต่ออินเทอร์เน็ตอีกครั้ง</p>
    <button class="btn" onclick="window.location.reload()">ลองใหม่อีกครั้ง</button>
  </div>
</body>
</html>
